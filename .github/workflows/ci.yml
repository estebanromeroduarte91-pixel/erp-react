name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 necesita una API interna de Node (webidl.util.markAsUncloneable)
          # que no existe en Node 20 — con esa versión, "Tests" fallaba con
          # "TypeError: webidl.util.markAsUncloneable is not a function" al cargar jsdom.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Typecheck + build
        run: npm run build

      # Smoke tests sobre el build real: verifican que la app no quede en
      # pantalla en blanco (landing, login, páginas públicas por token). Solo
      # se instala Chromium — el resto de los navegadores sería tiempo de CI
      # sin beneficio para lo que estas pruebas vigilan.
      - name: Instalar navegador para E2E
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (E2E)
        run: npm run test:e2e
