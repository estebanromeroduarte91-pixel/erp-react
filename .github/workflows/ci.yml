name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 necesita una API interna de Node (webidl.util.markAsUncloneable)
          # que no existe en Node 20 — con esa versión, "Tests" fallaba con
          # "TypeError: webidl.util.markAsUncloneable is not a function" al cargar jsdom.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Typecheck + build
        run: npm run build
