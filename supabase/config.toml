[functions.qr-photo]
# Las fotos se cargan directamente en etiquetas <img>, que no pueden adjuntar
# un header Authorization. La función valida el token QR y la ruta del objeto
# antes de servirlo, por lo que el gateway no debe exigir además un JWT.
verify_jwt = false

[functions.public-logo]
# Los logos de empresa también se consumen como imágenes públicas. La función
# limita internamente las rutas permitidas.
verify_jwt = false

[functions.delivery-solicitud]
# La llama el formulario público de WordPress (stevedocs.cl/delivery), que no
# tiene ni debe tener claves de Supabase. Con verificación de JWT el gateway
# responde 401 a toda solicitud. La función valida por su cuenta el formulario
# activo, el origen permitido, el módulo habilitado, RUT, teléfono y límite
# por IP antes de insertar con service_role.
verify_jwt = false

[functions.delivery-viaje]
# El motoboy no tiene cuenta Pixit: el enlace incluye un token aleatorio de
# 256 bits que la función verifica por hash y vencimiento antes de devolver
# solo los datos de ese viaje. El token viaja en el cuerpo POST, no en una URL
# del servidor, y el acceso se revoca al reasignar o cancelar.
verify_jwt = false

[functions.woo-webhook]
# WooCommerce firma con X-WC-Webhook-Signature (HMAC), no con un JWT de
# Supabase: con verificación de JWT el gateway la rechaza antes de que la
# función pueda validar nada, y los pedidos dejan de descontar stock en
# silencio. Ya pasó una vez. La autenticación real es el token de la URL más
# la firma HMAC, que la función comprueba por su cuenta.
verify_jwt = false

[functions.woo-conectar]
# El asistente recibe y valida credenciales comerciales de la tienda. El
# gateway exige JWT y la función vuelve a comprobar usuario, empresa y rol.
verify_jwt = true

[functions.woo-push]
# Ésta SÍ exige JWT, y se deja explícito para que nadie se lo saque por
# analogía con woo-webhook. La llaman el cron (con la service_role) y la app
# (con la sesión de la persona), y ambas mandan un JWT válido. Aun así el
# gateway no alcanza como control: la anon key también es un JWT válido y es
# pública, así que la función vuelve a comprobar quién llama.
verify_jwt = true

[functions.subscription-expiry-reminder]
# La ejecuta un proceso diario sin sesión de usuario. El gateway no exige JWT,
# pero la función valida un secreto dedicado en `x-cron-token` antes de usar
# service_role o enviar correos.
verify_jwt = false

[functions.dte-certificado]
# Exige JWT y además comprueba por dentro que quien llama sea admin de la
# empresa: por acá entra la firma legal del contribuyente, así que la anon key
# —que es pública— no vale como sesión.
verify_jwt = true

[functions.dte-caf]
# Mismo criterio que dte-certificado: JWT en el gateway y comprobación de rol
# admin adentro. Cargar folios equivocados produce documentos que el SII
# rechaza, con el folio ya gastado.
verify_jwt = true

[functions.dte-emitir]
# JWT en el gateway y comprobación de rol adentro. Emite quien vende, así que
# admite admin, encargado y vendedor — a diferencia de dte-certificado y
# dte-caf, que son configuración y quedan solo para admin.
verify_jwt = true

[functions.dte-enviar]
# La llama el cron con `x-cron-token` y también se puede disparar a mano desde
# la app. El gateway exige JWT; la comprobación real la hace la función.
verify_jwt = true

[functions.dte-consultar]
# La llama el cron con `x-cron-token`. Pregunta al SII si aceptó o rechazó cada
# sobre enviado; sin esto los documentos quedarían para siempre en "enviado".
verify_jwt = true

[functions.dte-imprimir]
# Exige JWT y filtra por la empresa de quien llama: sin ese filtro, pasando un
# folio cualquiera se podría pedir la boleta de otro taller. La puede usar
# cualquier rol con sesión — reimprimir es tarea de mostrador.
verify_jwt = true
