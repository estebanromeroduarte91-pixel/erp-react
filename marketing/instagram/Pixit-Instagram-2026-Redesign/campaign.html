function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function postHTML(p,i){const [name,title,sub,panel,cta]=p;return `<section class="piece" id="p${i+1}" data-export="${String(i+1).padStart(2,'0')}-${slug(name)}"><div class="piece-head"><span>${String(i+1).padStart(2,'0')} · Publicación individual</span><h2>${name}</h2></div><div class="stage"><article class="post" data-post><div class="bg"></div><div class="grid"></div><div class="pad"><img class="brand" src="assets/logo-pixit.png" alt="Pixit"><div class="copy"><h3>${title}</h3><p>${sub}</p></div><div class="app"><div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><strong>Pixit · ${name}</strong></div><div class="screen">${panels[panel]()}</div></div><div class="foot"><span class="cta">${cta}</span></div></div></article></div><div class="caption"><b>Idea de caption:</b> ${sub.replace(/<[^>]+>/g,'')} Con Pixit, esta función queda conectada con el resto de tu operación. <b>Prueba gratis por 30 días.</b></div></section>`}
document.getElementById('feed').innerHTML=posts.map(postHTML).join('');
document.getElementById('index').innerHTML=posts.map((p,i)=>`<li><a href="#p${i+1}">${String(i+1).padStart(2,'0')} · ${p[0]}</a></li>`).join('');
function fit(){document.querySelectorAll('.post').forEach(x=>x.style.transform=`scale(${x.parentElement.clientWidth/1080})`)}fit();addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(fit);
</script></body></html>
